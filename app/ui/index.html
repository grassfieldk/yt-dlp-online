<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yt-dlp ダウンロード</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { display: none; }
        .subtitle { display: none; }
        form { background: transparent; padding: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        input:focus, select:focus { outline: none; border-color: #333; }
        .buttons { display: flex; gap: 10px; margin-top: 25px; flex-wrap: wrap; }
        button {
            padding: 12px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            white-space: nowrap;
        }
        .btn-primary { background: #333; color: white; flex: 1; min-width: 120px; }
        .btn-primary:hover { background: #555; }
        .btn-secondary { background: #e0e0e0; color: #333; flex: 1; min-width: 120px; }
        .btn-secondary:hover { background: #ccc; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .formats-container { margin-top: 20px; background: #f9f9f9; padding: 15px; border-radius: 4px; }
        .formats-container h3 { font-size: 14px; margin-bottom: 12px; }
        .format-item { padding: 10px; background: white; border-left: 3px solid #333; margin-bottom: 8px; cursor: pointer; font-size: 13px; }
        .format-item:hover { background: #f0f0f0; }
        .progress { margin-top: 20px; display: none; }
        .progress-bar { height: 6px; background: #ddd; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: #333; width: 0%; }
        .message { margin-top: 20px; padding: 12px; border-radius: 4px; text-align: center; display: none; font-size: 14px; }
        .message.success { background: #d4edda; color: #155724; }
        .message.error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <form id="downloadForm">
            <div class="form-group">
                <label for="apiKey">API キー</label>
                <input type="password" id="apiKey" placeholder="API キーを入力" required>
            </div>

            <div class="form-group">
                <label for="videoUrl">ビデオ URL</label>
                <input type="url" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." required>
            </div>

            <div class="form-group">
                <label for="quality">画質</label>
                <select id="quality">
                    <option value="">自動選択</option>
                    <option value="1080">1080p</option>
                    <option value="720">720p</option>
                    <option value="480">480p</option>
                </select>
            </div>

            <div class="buttons">
                <button type="button" id="fetchFormatsBtn" class="btn-secondary">フォーマット取得</button>
                <button type="submit" id="downloadBtn" class="btn-primary">ダウンロード</button>
            </div>

            <div id="formatsContainer" class="formats-container" style="display: none;">
                <h3>フォーマット</h3>
                <div id="formatsList"></div>
            </div>

            <div class="progress" id="progress">
                <p id="progressText">処理中...</p>
                <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
            </div>

            <div id="message" class="message"></div>
        </form>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
